<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><html>
<head th:replace="~{anime-web/common/header/index :: meta(~{::title},~{::link},~{::script})}">
	<title>あ</title>
	<link rel="stylesheet" th:href="@{/anime-web/common/main/index.css}">
	<link rel="stylesheet" th:href="@{/anime-web/etc/settings/addanime/index.css}">


	<script th:src="@{/anime-web/common/main/index.js}"></script>
	<script th:src="@{/anime-web/etc/settings/addanime/index.js}"></script>
	<script th:src="@{/anime-web/common/main/leftPanel.js}"></script>
	<script th:src="@{/anime-web/class/class_ajax.js}"></script>
	<script th:src="@{/anime-web/class/class_upload.js}"></script>
	<script th:src="@{/anime-web/etc/settings/addanime/upload.js}"></script>
	<script th:src="@{/anime-web/etc/settings/addanime/edit.js}"></script>
</head>

<body>
	<header th:replace="~{anime-web/common/header/index :: header}"></header>
	<br>
		<div id="main">
			<div id="left">
				<h2>番組を追加</h2>
				<hr>
				<form action="/anime-web/etc/settings/addanime/" method="post" enctype="multipart/form-data">
					<input id="selectFile" type="file" name="upload" multiple>
					<input type="button" id="exe" value="実行">
				</form>
				
				
				
				<p id="result"></p>
				
				<h2>番組名検索ベクトル</h2>
				<hr>
				<p>残り番組数：
					<span id="remainingTitleCount" th:text="${titleCount}">  </span>
					
					<span><input id="titleAjaxButton" type="button" value="実行"></span>
				</p>
				<p>/anime-web/api/db/vectorAPI/AnimeVector/{limitter}</p>
				<textarea id="vectorTitleArea"></textarea>
				
				
				<h2>番組説明検索ベクトル</h2>
				<hr>
				<p>残り番組数：
					<span id="remainingCount" th:text="${progCount}">  </span>
					
					<span><input id="progAjaxButton" type="button" value="実行"></span>
				</p>
				<p>/anime-web/api/db/vectorAPI/progInsert/{limitter}</p>
								
				<textarea id="vectorArea"></textarea>
				
				<h2>エラー</h2>
				<hr>
				<textarea id="error"></textarea>
				
			</div><!--left-->
			
			<div id="left_main">
				<div id="left_main_child">
					<h2>修正欄</h2>
					<hr>
					<div id="fileEdit">
						<div style="display:none"><!--コピー用-->
							<div id="inputEdit">
								<p></p>
								<input type="text">
								<input type="hidden">
								<input type="hidden">
							</div><!--class:inputEdit-->
							
						</div>

					</div><!--fileEdit-->
					<input type="button" id="imgUpload" value="アップロード" style="display:none">
				</div><!--left_main_child-->
			</div><!--left_main-->
			
		</div><!--main-->
</body>
</html>
